name: Release

on:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: darwin
            goarch: amd64
            name: macOS Intel
          - goos: darwin
            goarch: arm64
            name: macOS Apple Silicon
          - goos: linux
            goarch: amd64
            name: Linux AMD64
          - goos: linux
            goarch: arm64
            name: Linux ARM64

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          go build -o netmon .
          tar -czf netmon-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz netmon

      - name: Calculate and output SHA256
        run: |
          SHA256=$(shasum -a 256 netmon-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz | cut -d' ' -f1)
          echo "SHA256 for ${{ matrix.goos }}-${{ matrix.goarch }}: $SHA256"
          echo "${{ matrix.goos }}-${{ matrix.goarch }}=$SHA256" >> $GITHUB_STEP_SUMMARY

      - name: Upload to Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            netmon-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz
          tag_name: ${{ github.event.release.tag_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

  trigger-homebrew-update:
    needs: build
    runs-on: ubuntu-latest
    
    steps:
      - name: Trigger homebrew-netmon update
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: zzzzseong/homebrew-netmon
          event-type: release-created
          client-payload: |
            {
              "tag": "${{ github.event.release.tag_name }}",
              "repository": "${{ github.repository }}"
            }
